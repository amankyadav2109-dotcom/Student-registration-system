  <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Login</title>

<link rel="stylesheet" href="Employee.css">
</head> <body>
<div class="login-page">

    <div class="login-card">

        <div class="login-icon">
            🔐
        </div>

        <h1>Employee Login</h1>

        <p class="login-subtitle">
            Login to access the student management dashboard
        </p>

        <form id="employeeLoginForm">

            <label for="employeeId">
                Employee ID
            </label>

            <input
                type="text"
                id="employeeId"
                placeholder="Enter Employee ID"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <button type="button" class="back-button" id="backHome">
            ← Back to Home
        </button>

    </div>

</div>
<script>

    document.getElementById("backHome").addEventListener("click", function()
    {
        window.location.href = "index.html";
    });


    document.getElementById("employeeLoginForm").addEventListener("submit", function(event)
    {
        event.preventDefault();


        const employeeId =
            document.getElementById("employeeId").value.trim();

        const password =
            document.getElementById("password").value;


        if (employeeId === "admin" && password === "1234")
        {
            window.location.href = "employee-dashboard.html";
        }
        else
        {
            alert("Invalid Employee ID or Password!");
        }

    });

</script>
</body> 
</html>
